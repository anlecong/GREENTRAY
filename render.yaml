services:
  - type: web
    name: greentray
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: GREENTRAY_ENV
        value: production
      - key: GREENTRAY_DATABASE
        value: /tmp/greentray.db
      - key: ADMIN_EMAIL
        value: admin@greentray.local
      - key: ADMIN_NAME
        value: Quản trị viên
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
